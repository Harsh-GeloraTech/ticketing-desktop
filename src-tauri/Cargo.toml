[package]
name = "ticketing-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ticketing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local SQLite store for the printer prototype (printers + printed tickets).
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
# Unique ticket numbers and sync idempotency keys.
uuid = { version = "1", features = ["v4"] }
# Friendly error handling in the printer service.
thiserror = "1"
# Sync layer: HTTP client to push the outbox to the cloud Axum API.
# rustls avoids a system OpenSSL dependency so the installer stays self-contained.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Timestamps + backoff math for the sync queue.
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
# Raw spooler access on Windows (OpenPrinter / StartDocPrinter / WritePrinter).
# NOTE: OpenPrinterW and PRINTER_DEFAULTSW are gated behind Win32_Graphics_Gdi
# in the windows crate (PRINTER_DEFAULTSW references a GDI type), so that
# feature is required in addition to Win32_Graphics_Printing.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_System_Com",
] }
